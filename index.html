<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music writing cheatsheet</title>
    <meta
      name="description"
      content="Pick a key and see its scale, modes, intervals and chords."
    />
    <!-- Before first paint, so the page never flashes the wrong theme. The light/dark half of cubeui's
         THEME_PRE_PAINT_SCRIPT (src/components/ui/theme-preference-base.ts); keep that half in step.
         The palette half is left out on purpose: this app is always the default palette (see App.tsx). -->
    <script>(function(){try{var p=localStorage.getItem("cubeui-theme"),d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches),c=document.documentElement.classList;c.toggle("dark",d);c.toggle("light",p==="light")}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
