<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music writing cheatsheet</title>
    <meta
      name="description"
      content="Pick a key and see its scale, modes, intervals and chords."
    />
    <script>
      // Before first paint, so the page never flashes the wrong palette.
      (() => {
        const stored = localStorage.getItem('mwc-theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
